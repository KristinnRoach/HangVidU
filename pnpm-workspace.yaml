packages:
  - backend/cloudflare

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  esbuild: true
  protobufjs: true
  re2: false
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  'ajv@>=8': 8.18.0
  'eslint>ajv': 6.12.6
  fast-xml-parser: 5.5.7
  'minimatch@>=5 <5.1.7': 5.1.9
  'minimatch@>=9 <9.0.6': 9.0.9
  'minimatch@>=10 <10.2.1': 10.2.5
  'picomatch@<2.3.2': 2.3.2
  'picomatch@>=4 <4.0.4': 4.0.4
  serialize-javascript: 7.0.5
  vite: 'catalog:'
  vitest: 'catalog:'

# First-party scope — our own packages, exempt from the release-age cooldown.
minimumReleaseAgeExclude:
  - '@kidlib/*'
  - miniflare@4.20260617.0 || 5.20261006.2-beta
  - wrangler@4.102.0 || 4.150.0
  - '@cloudflare/vitest-plugin@1.4.1'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
  '@vitest/browser-playwright': 5.0.3
  '@vitest/coverage-v8': 5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
