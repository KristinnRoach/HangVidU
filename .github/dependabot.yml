version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # toolchain-update.yml runs vp migrate to keep these versions aligned.
    ignore:
      - dependency-name: 'vite-plus'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@vitest/browser'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@vitest/browser-preview'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@vitest/browser-playwright'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      majors:
        patterns: ['*']
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels:
      - 'dependencies'
  - package-ecosystem: 'npm'
    directory: '/backend/firebase'
    schedule:
      interval: 'weekly'
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      majors:
        patterns: ['*']
        update-types: [major]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels:
      - 'dependencies'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
      majors:
        patterns: ['*']
        update-types: [major]
    labels:
      - 'dependencies'
