version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
  - package-ecosystem: 'npm'
    directory: '/backend/firebase'
    schedule:
      interval: 'weekly'
    groups:
      firebase-functions:
        patterns: ['*']
    labels:
      - 'dependencies'
